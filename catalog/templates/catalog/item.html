{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Item {{ item.id }}</title>
    <script src="{% static 'catalog/order.js' %}" defer></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 600px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #333;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 1.5rem;
        margin-bottom: 1rem;
      }
      .btn {
        display: inline-block;
        padding: 0.5rem 1rem;
        background: #0066cc;
        color: #fff;
        border: none;
        border-radius: 4px;
        text-decoration: none;
        cursor: pointer;
      }
      .status {
        display: block;
        margin-top: 1rem;
        color: #666;
        font-size: 0.9rem;
      }
      .nav-link {
        display: inline-block;
        margin-top: 1rem;
        color: #0066cc;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    {% csrf_token %}
    <div class="card">
      <h1>Item {{ item.id }}</h1>
      <button id="add-button" class="btn" data-item-id="{{ item.id }}">
        Add to order
      </button>
      <span id="item-quantity" class="status">Currently in order: 0</span>
      <div id="checkout-container" style="margin-top: 1rem"></div>
    </div>
    <a href="/catalog" class="nav-link">&larr; Back to catalog</a>
  </body>
</html>
